[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosim"
version = "0.1.0"
description = "Aerogel k Simulator: heat paths through a dry freeze-cast honeycomb aerogel skeleton"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["aerosim*"]

[tool.pytest.ini_options]
testpaths = [".agent/tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = ["slow: long runs (lattice Boltzmann onset); run with  python -m pytest -m slow"]

[tool.ruff]
line-length = 100
extend-exclude = ["guide", "*.md"]  # not simulator code

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]  # pycodestyle, pyflakes, import order, common bugs
